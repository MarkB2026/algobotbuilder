<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build A Trading Bot — Prototype</title>
<style>body{margin:0;background:#05090d;color:#eef7fb;font:16px Arial,sans-serif}.wrap{max-width:720px;margin:50px auto;padding:28px}.card{background:#0c141b;border:1px solid #1c3b4c;border-radius:16px;padding:28px;box-shadow:0 18px 60px #0008}h1{margin:0 0 8px;font-size:32px}p{color:#9fb4c0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#7ddcff}select,input{background:#071016;color:#fff;border:1px solid #28536a;border-radius:8px;padding:12px;font-size:15px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#6de4ff;color:#001018;font-weight:800;font-size:16px;cursor:pointer}.note{font-size:13px;margin-top:16px}.full{grid-column:1/-1}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="card"><h1>BUILD A TRADING BOT</h1><p>Prototype 0.1 — choose a few rules and generate a bot plan.</p>
<div class="grid">
<div class="field"><label>Bot name</label><input id="bot_name" value="My Trading Bot"></div>
<div class="field"><label>Broker</label><select id="broker"><option>IBKR</option></select></div>
<div class="field"><label>Symbol</label><input id="symbol" value="SPY"></div>
<div class="field"><label>Direction</label><select id="direction"><option>LONG</option><option>SHORT</option></select></div>
<div class="field"><label>Entry rule</label><select id="entry"><option value="RSI_BELOW">RSI below</option><option value="RSI_ABOVE">RSI above</option></select></div>
<div class="field"><label>Entry value</label><input id="entry_value" type="number" value="30"></div>
<div class="field"><label>Exit rule</label><select id="exit"><option value="RSI_ABOVE">RSI above</option><option value="RSI_BELOW">RSI below</option></select></div>
<div class="field"><label>Exit value</label><input id="exit_value" type="number" value="70"></div>
<div class="field"><label>Quantity</label><input id="quantity" type="number" min="1" value="1"></div>
<div class="field"><label>Mode</label><select id="mode"><option>PAPER</option></select></div>
</div><button onclick="buildPlan()">BUILD MY BOT PLAN</button><p class="note">Prototype safety: PAPER only. Order execution is disabled. Broker credentials are never entered here.</p></div></div>
<script>
function v(id){return document.getElementById(id).value}
function buildPlan(){
 const plan={schema:"buildatradingbot.plan.v0.1",bot_name:v("bot_name"),broker:v("broker"),symbol:v("symbol").trim().toUpperCase(),direction:v("direction"),entry:{indicator:"RSI",operator:v("entry")==="RSI_BELOW"?"<":">",value:Number(v("entry_value"))},exit:{indicator:"RSI",operator:v("exit")==="RSI_BELOW"?"<":">",value:Number(v("exit_value"))},quantity:Number(v("quantity")),mode:v("mode"),execution_enabled:false};
 const blob=new Blob([JSON.stringify(plan,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="bot_plan.json"; a.click(); URL.revokeObjectURL(a.href);
}
</script></body></html>
